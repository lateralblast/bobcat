[package]
name = "bobcat-cli"
version = "1.3.5"
license = "CC-BY-NC-SA-4.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
keyring = "4"
libc = "0.2.190"
openssl = "0.10.81"
rpassword = "7.5.4"
serde_json = "1.0.154"
ssh2 = "0.9.6"
vnc = "0.4"

[profile.dev]
# the screen-to-text conversion is pixel work; unoptimised builds make it painfully slow
opt-level = 2
