[package]
name = "bobcat"
version = "2.0.6"
edition = "2021"
license = "CC-BY-NC-SA-4.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# build OpenSSL into the binary instead of linking the system/Homebrew one (used for installers)
vendored = ["openssl/vendored", "ssh2/vendored-openssl"]

[dependencies]
tauri = { version = "2", features = ["unstable"] }
vnc = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
openssl = "0.10.81"
serde_json = "1.0.154"
ssh2 = "0.9.6"
portable-pty = "0.9.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = "1.1.10"
keyring = "4"
rfd = "0.17"
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "pdu", "core", "cliprdr", "displaycontrol", "dvc", "svc"] }
ironrdp-blocking = "0.10.0"
x509-cert = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_6"] }
gtk = "0.18"
javascriptcore-rs = "1.1"
cairo-rs = { version = "0.18", features = ["png"] }
x11rb = { version = "0.13", features = ["xtest"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
security-framework = "3"
core-foundation = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
